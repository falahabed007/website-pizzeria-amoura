g>Grund:</strong> ${reason}</div>`:''} ${refundHtml} <p>Bei Fragen: <strong>02521 / 829 06 00</strong></p> </div> </div>` }); } catch(e) { console.error('Storno Mail:', e); } } // ═══════════════════════════════════════════════════════════════ // PRINTNODE // ═══════════════════════════════════════════════════════════════ async function triggerPrint(order) { if (!process.env.PRINTNODE_API_KEY || !process.env.PRINTNODE_PRINTER_ID) return; try { const p = require('./printnode-helper'); await p.printOrder(order); } catch(e) { console.error('PrintNode:', e); } } // ═══════════════════════════════════════════════════════════════ // AUTO-STATUS (Cron – jede Minute, Öffnungszeiten Deutschland) // ═══════════════════════════════════════════════════════════════ function calcAutoMode() { // Deutsche Zeit berechnen const deTime = new Date().toLocaleString('de-DE', { timeZone: 'Europe/Berlin' }); const parts = deTime.match(/(\\d+)\\.(\\d+)\\.(\\d+),\\s*(\\d+):(\\d+)/); if (!parts) return 'geschlossen'; const day = parseInt(parts[1]); const mon = parseInt(parts[2]); const year = parseInt(parts[3]); const h = parseInt(parts[4]); const m = parseInt(parts[5]); const mins = h * 60 + m; // Wochentag berechnen (0=So, 1=Mo, ..., 6=Sa) const wd = new Date(year, mon - 1, day).getDay(); // Dienstag = Ruhetag if (wd === 2) return 'geschlossen'; // Samstag: 17:00–22:00 if (wd === 6) { return (mins >= 17*60 && mins < 22*60) ? 'online' : 'geschlossen'; } // Sonntag: 12:00–14:00 & 16:00–22:00 if (wd === 0) { const session1 = mins >= 12*60 && mins < 14*60; const session2 = mins >= 16*60 && mins < 22*60; return (session1 || session2) ? 'online' : 'geschlossen'; } // Mo, Mi, Do, Fr: 11:30–14:00 & 17:00–22:00 const session1 = mins >= 11*60+30 && mins < 14*60; const session2 = mins >= 17*60 && mins < 22*60; return (session1 || session2) ? 'online' : 'geschlossen'; } cron.schedule('* * * * *', async () => { try { const s = await Settings.findById('restaurant'); if (s && s.manualOverride) return; // Manuell gesetzt – nicht überschreiben const autoMode = calcAutoMode(); await Settings.findByIdAndUpdate('restaurant', { mode: autoMode, isOpen: autoMode === 'online' }, { upsert: true, new: true } ); } catch(e) { console.error('Auto-Status Fehler:', e); } }); // ═══════════════════════════════════════════════════════════════ // WOCHENBERICHT + RECHNUNG (Cron – jeden Sonntag 23:59) // ═══════════════════════════════════════════════════════════════ // PDF-Generator Helper function generatePdf(buildFn) { return new Promise((resolve, reject) => { const doc = new PDFDocument({ margin: 50, size: 'A4' }); const chunks = []; doc.on('data', chunk => chunks.push(chunk)); doc.on('end', () => resolve(Buffer.concat(chunks))); doc.on('error', reject); buildFn(doc); doc.end(); }); } // ─── PDF Layout-Helpers ─────────────────────────────────────────────────── const PDF_M = 50; const PDF_W = 495; const PDF_PW = 595; const PDF_FT = 810; const PDF_SV = 0.99; const PDF_PR = 0.05; const pdfFmt = n => n.toFixed(2).replace('.', ',') + ' €'; function pdfColorBox(doc, title, sub, color = '#8b1d1d', h = 70) { doc.rect(0, 0, PDF_PW, h).fill(color); doc.font('Helvetica-Bold').fontSize(20).fillColor('#fff').text(title, PDF_M, 18); if (sub) doc.font('Helvetica').fontSize(9).fillColor('rgba(255,255,255,0.75)').text(sub, PDF_M, 44); doc.y = h + 12; } function pdfHr(doc, color = '#ddd', lw = 0.5) { doc.moveTo(PDF_M, doc.y).lineTo(PDF_M + PDF_W, doc.y).strokeColor(color).lineWidth(lw).stroke(); doc.y += lw + 3; } function pdfKacheln(doc, items) { const kW = Math.floor((PDF_W - (items.length - 1) * 8) / items.length); const top = doc.y; items.forEach(([label, value, color], i) => { const x = PDF_M + i * (kW + 8); doc.rect(x, top, kW, 46).fill(color); doc.font('Helvetica').fontSize(7.5).fillColor('rgba(255,255,255,0.72)').text(label, x + 8, top + 8, { width: kW - 12 }); doc.font('Helvetica-Bold').fontSize(14).fillColor('#fff').text(value, x + 8, top + 22, { width: kW - 12 }); }); doc.y = top + 54; } function pdfTableRow(doc, cells, shade, bold = false) { const top = doc.y; if (shade) doc.rect(PDF_M, top, PDF_W, 20).fill('#f5f7fa'); cells.forEach(([txt, x, w, align]) => { const opts = align ? { width: w, align } : { width: w }; (bold ? doc.font('Helvetica-Bold') : doc.font('Helvetica')) .fontSize(9.5).fillColor('#222').text(txt, x, top + 5, opts); }); doc.y = top + 20; } function pdfKundenliste(doc, orders) { function drawGroup(label, color, list) { if (!list.length) return; const gy = doc.y; doc.rect(PDF_M, gy, PDF_W, 22).fill(color); doc.font('Helvetica-Bold').fontSize(10).fillColor('#fff').text(label, PDF_M + 8, gy + 6, { width: PDF_W - 16 }); doc.y = gy + 22 + 2; const hy = doc.y; doc.rect(PDF_M, hy, PDF_W, 16).fill('#eaeef3'); [['#', PDF_M+2, 30, 'left'], ['Datum', PDF_M+34, 40, 'left'], ['Kunde', PDF_M+76, 190, 'left'], ['Art', PDF_M+268, 80, 'left'], ['Betrag', PDF_M+2, PDF_W-4, 'right'] ].forEach(([h, x, w, a]) => doc.font('Helvetica-Bold').fontSize(8).fillColor('#444').text(h, x, hy+4, { width:w, align:a })); doc.y = hy + 16 + 2; let sub = 0; list.forEach((o, i) => { if (doc.y > PDF_FT - 24) { doc.addPage(); doc.y = PDF_M; } const date = new Date(o.createdAt).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' }) + '.'; const name = `${o.customer?.first||''} ${o.customer?.last||''}`.trim().substring(0, 28); const modeStr = o.mode === 'lieferung' ? 'Lieferung' : 'Abholung'; const ry = doc.y; if (i % 2 === 0) doc.rect(PDF_M, ry, PDF_W, 18).fill('#fafafa'); doc.font('Helvetica').fontSize(9).fillColor('#222') .text(`${o.orderNum}`, PDF_M+2, ry+4, { width:30 }) .text(date, PDF_M+34, ry+4, { width:40 }) .text(name, PDF_M+76, ry+4, { width:188 }) .text(modeStr, PDF_M+268, ry+4, { width:80 }); doc.font('Helvetica-Bold').fontSize(9).fillColor('#222') .text(pdfFmt(o.total||0), PDF_M+2, ry+4, { width:PDF_W-4, align:'right' }); doc.y = ry + 18; sub += (o.total||0); }); const sy = doc.y; doc.rect(PDF_M, sy, PDF_W, 20).fill(color + '28'); doc.font('Helvetica').fontSize(9).fillColor('#333').text(`Summe ${label}:`, PDF_M+8, sy+5); doc.font('Helvetica-Bold').fontSize(10).fillColor('#333').text(pdfFmt(sub), PDF_M+2, sy+5, { width:PDF_W-4, align:'right' }); doc.y = sy + 20 + 10; } drawGroup('Barzahlung', '#8b1d1d', orders.filter(o => o.payment === 'bar')); drawGroup('Online-Zahlung (Stripe)', '#276749', orders.filter(o => o.payment !== 'bar')); } function pdfBarRechnung(doc, barOrders, barStats, zeitraum, rgnr) { if (!barOrders.length) return; doc.addPage(); doc.y = PDF_M; doc.rect(0, 0, PDF_PW, 50).fill('#1a1a2e'); doc.font('Helvetica-Bold').fontSize(16).fillColor('#fff').text('Bar-Rechnung', PDF_M, 14); doc.font('Helvetica').fontSize(9).fillColor('rgba(255,255,255,0.7)').text(`FlueVate Online-Bestellsystem · ${zeitraum}`, PDF_M, 33); doc.y = 62; const addrY = doc.y; doc.font('Helvetica-Bold').fontSize(9).fillColor('#1a1a2e').text('Rechnungssteller:', PDF_M, addrY); doc.font('Helvetica').fontSize(9).fillColor('#444').text('Abed Rachman Falah · FlueVate', PDF_M, addrY+12).text('Zur Goldbrede 30, 59269 Beckum', PDF_M, addrY+22); doc.font('Helvetica-Bold').fontSize(9).fillColor('#1a1a2e').text('Rechnungsempfänger:', PDF_M+270, addrY); doc.font('Helvetica').fontSize(9).fillColor('#444').text('Pizzeria Amoura', PDF_M+270, addrY+12).text('Oststraße 48, 59269 Beckum', PDF_M+270, addrY+22); doc.y = addrY + 38; doc.font('Helvetica').fontSize(8.5).fillColor('#888').text(`Zeitraum: ${zeitraum} · Rg.-Nr.: ${rgnr}`, PDF_M, doc.y); doc.y += 12; const hy = doc.y; doc.rect(PDF_M, hy, PDF_W, 16).fill('#fef9e7'); doc.font('Helvetica').fontSize(7.5).fillColor('#7a5c00').text('ℹ Nur Barzahlungen – Stripe-Gebühren wurden bereits automatisch beim Checkout einbehalten.', PDF_M+6, hy+4, { width:PDF_W-12 }); doc.y = hy + 16 + 6; doc.moveTo(PDF_M, doc.y).lineTo(PDF_M+PDF_W, doc.y).strokeColor('#333').lineWidth(1).stroke(); doc.y += 4; const th = doc.y; doc.rect(PDF_M, th, PDF_W, 16).fill('#1a1a2e'); [['#', PDF_M+2, 34, 'left'], ['Datum', PDF_M+38, 