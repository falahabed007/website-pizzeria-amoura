ef = orders.filter(o=>o.mode==='lieferung').length; const nAbh = orders.filter(o=>o.mode==='abholung').length; const tagespdf = await generatePdf(doc => { const W = 495; const fmt = n => n.toFixed(2).replace('.',',')+' €'; // Header doc.rect(0,0,595,70).fill('#8b1d1d'); doc.fontSize(22).font('Helvetica-Bold').fillColor('#fff').text('Tagesbericht', 50, 16); doc.fontSize(10).font('Helvetica').fillColor('rgba(255,255,255,0.8)') .text(`Pizzeria Amoura · ${label}`, 50, 44); doc.moveDown(3.5); // Zusammenfassung const sumRows = [ ['Bestellungen gesamt', `${orders.length}`, false], ['davon Lieferung', `${nLief}`, true], ['davon Abholung', `${nAbh}`, false], ['Umsatz Barzahlung', fmt(totalBar), true], ['Umsatz Kreditkarte (Stripe)', fmt(totalStripe), false], ]; sumRows.forEach(([label, val, shade]) => { const y = doc.y; if (shade) doc.rect(50,y,W,26).fill('#f5f5f5'); doc.font('Helvetica').fontSize(11).fillColor('#222').text(label, 58, y+7); doc.text(val, 50, y+7, { width: W-8, align:'right' }); doc.y = y+26; }); // Gesamtumsatz const ty = doc.y; doc.rect(50,ty,W,36).fill('#8b1d1d'); doc.font('Helvetica-Bold').fontSize(14).fillColor('#fff') .text('GESAMTUMSATZ', 58, ty+11); doc.text(fmt(total), 50, ty+11, { width:W-8, align:'right' }); doc.y = ty+50; doc.moveDown(1); // Bestelldetails doc.font('Helvetica-Bold').fontSize(13).fillColor('#8b1d1d').text('Alle Bestellungen'); doc.moveDown(0.4); orders.forEach((o, i) => { if (doc.y > 730) doc.addPage(); const rowY = doc.y; const shade = i % 2 === 0; if (shade) doc.rect(50,rowY,W,0).fill('#f9f9f9'); const kunde = `${o.customer?.first||''} ${o.customer?.last||''}`.trim() || '–'; const telefon = o.customer?.phone || '–'; const email = o.customer?.email || '–'; const adresse = o.mode==='lieferung' ? `${o.customer?.street||''} ${o.customer?.house||''}, ${o.customer?.city||''}`.trim() : 'Abholung'; const zahlung = o.payment==='stripe'?'Kreditkarte':o.payment==='karte'?'EC-Karte':'Bar'; const bezahlt = o.paymentStatus==='paid'?'✓ Bezahlt