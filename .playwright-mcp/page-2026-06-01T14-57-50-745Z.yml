                - generic [ref=e283]:
                  - textbox "file content" [ref=e288]: "const express = require('express'); const mongoose = require('mongoose'); const cors = require('cors'); const Stripe = require('stripe'); const { Resend } = require('resend'); // v2.0.1 const cron = require('node-cron'); const PDFDocument = require('pdfkit'); const bcrypt = require('bcryptjs'); const jwt = require('jsonwebtoken'); require('dotenv').config(); const app = express(); const PORT = process.env.PORT || 3001; // Stripe lazy – liest Key bei jedem Aufruf function getStripe() { const key = process.env.STRIPE_SECRET_KEY; if (!key) throw new Error('STRIPE_SECRET_KEY nicht gesetzt'); return Stripe(key); } // Resend lazy – kein Crash beim Start wenn Key fehlt function getResend() { const key = process.env.RESEND_API_KEY; if (!key) { console.warn('⚠️ RESEND_API_KEY fehlt – E-Mails werden nicht gesendet'); return null; } return new Resend(key); } // ─── CORS ──────────────────────────────────────────────────────── const allowedOrigins = [ 'https://pizzeria-amoura.de', 'https://www.pizzeria-amoura.de', ]; app.use(cors({ origin: function(origin, callback) { // Kein Origin = Postman / server-to-server / lokale Datei → erlauben if (!origin) return callback(null, true); if (allowedOrigins.includes(origin)) return callback(null, origin); console.warn('CORS blockiert:', origin); return callback(new Error('CORS nicht erlaubt für: ' + origin)); }, methods: ['GET','POST','PATCH','DELETE','OPTIONS'], allowedHeaders: ['Content-Type','Authorization'], credentials: true })); // Preflight für alle Routen app.options('*', cors()); // ─── Stripe Webhook braucht raw body ───────────────────────────── app.use('/api/stripe-webhook', express.raw({ type: 'application/json' })); app.use(express.json()); // ─── Statische HTML-Dateien (kein Cache) ───────────────────────── const path = require('path'); app.use(express.static(path.join(__dirname), { etag: false, setHeaders: (res, filePath) => { if (filePath.endsWith('.html')) { res.setHeader('Cache-Control', 'no-store, no-cache, must-revalidate'); } } })); // ─── MongoDB ───────────────────────────────────────────────────── mongoose.connect(process.env.MONGODB_URI) .then(() => console.log('✅ MongoDB verbunden')) .catch(err => console.error('❌ MongoDB:', err)); // ═══════════════════════════════════════════════════════════════ // SCHEMAS // ═══════════════════════════════════════════════════════════════ const orderSchema = new mongoose.Schema({ orderNum: { type: Number, unique: true }, mode: { type: String, enum: ['lieferung','abholung'], required: true }, status: { type: String, default: 'pending', enum: ['awaiting_payment','pending','confirmed','preparing','ready','delivered','cancelled'] }, payment: { type: String, enum: ['bar','stripe','karte'], required: true }, paymentStatus: { type: String, default: 'unpaid', enum: ['unpaid','paid','pending','refunded'] }, source: { type: String, default: 'web', enum: ['web','pos'] }, stripeSessionId: String, stripePaymentIntentId:String, prepTime: Number, cancelReason: { type: String, default: '' }, customer: { first: String, last: String, email: String, phone: String, city: String, street: String, house: String }, items: [{ name: String, price: Number, qty: Number, note: String, extraDetails: [{ name: String, price: Number }] }], subtotal: Number, deliveryFee: { type: Number, default: 0 }, serviceFee: { type: Number, default: 0.99 }, total: Number, note: String, coupon: String, userId: { type: mongoose.Schema.Types.ObjectId, ref: 'User', default: null }, }, { timestamps: true }); const Order = mongoose.model('Order', orderSchema); const counterSchema = new mongoose.Schema({ _id: String, seq: Number }); const Counter = mongoose.model('Counter', counterSchema); const availabilitySchema = new mongoose.Schema({ itemName: { type: String, required: true, unique: true }, available: { type: Boolean, default: false } }, { timestamps: true }); const Availability = mongoose.model('Availability', availabilitySchema); const settingsSchema = new mongoose.Schema({ _id: String, mode: { type: String, default: 'online', enum: ['online','geschlossen','neutral'] }, manualOverride: { type: Boolean, default: false }, // Rückwärtskompatibilität isOpen: { type: Boolean, default: true } }); const Settings = mongoose.model('Settings', settingsSchema); const userSchema = new mongoose.Schema({ email: { type: String, required: true, unique: true, lowercase: true, trim: true }, password: { type: String, required: true }, first: { type: String, required: true, trim: true }, last: { type: String, required: true, trim: true }, phone: { type: String, default: '' }, addresses: [{ label: { type: String, default: 'Zuhause' }, street: String, house: String, city: String, zip: String, }], defaultAddress: { type: Number, default: 0 }, }, { timestamps: true }); const User = mongoose.model('User', userSchema); // ─── Counter ───────────────────────────────────────────────────── async function getNextOrderNum() { const r = await Counter.findByIdAndUpdate('orderNum', { $inc: { seq: 1 } }, { new: true, upsert: true }); return r.seq + 1000; } // ─── Admin Auth ─────────────────────────────────────────────────── function auth(req, res, next) { const h = req.headers.authorization; if (!h || !h.startsWith('Bearer ')) return res.status(401).json({ message: 'Nicht autorisiert' }); if (h.split(' ')[1] !== process.env.ADMIN_TOKEN_SECRET) return res.status(401).json({ message: 'Token ungültig' }); next(); } // ─── Customer Auth (JWT) ────────────────────────────────────────── function customerAuth(req, res, next) { const auth = req.headers.authorization; if (!auth || !auth.startsWith('Bearer ')) { return res.status(401).json({ message: 'Nicht eingeloggt' }); } try { req.user = jwt.verify(auth.split(' ')[1], process.env.JWT_SECRET); next(); } catch { res.status(401).json({ message: 'Token abgelaufen oder ungültig' }); } } // ═══════════════════════════════════════════════════════════════ // KUNDEN-AUTH ROUTES // ═══════════════════════════════════════════════════════════════ app.post('/api/auth/register', async (req, res) => { try { const { email, password, first, last, phone } = req.body; if (!email || !password || !first || !last || !phone) { return res.status(400).json({ message: 'Alle Pflichtfelder ausfüllen' }); } if (password.length < 6) { return res.status(400).json({ message: 'Passwort mindestens 6 Zeichen' }); } const exists = await User.findOne({ email }); if (exists) return res.status(409).json({ message: 'E-Mail bereits registriert' }); const hash = await bcrypt.hash(password, 12); const user = await User.create({ email, password: hash, first, last, phone: phone || '' }); const token = jwt.sign({ id: user._id, email: user.email }, process.env.JWT_SECRET, { expiresIn: '30d' }); res.status(201).json({ token, user: { id: user._id, email: user.email, first: user.first, last: user.last } }); } catch (err) { console.error('Register Fehler:', err); res.status(500).json({ message: 'Registrierung fehlgeschlagen' }); } }); app.post('/api/auth/login', async (req, res) => { try { const { email, password } = req.body; const user = await User.findOne({ email }); if (!user) return res.status(401).json({ message: 'Falsche E-Mail oder Passwort' }); const valid = await bcrypt.compare(password, user.password); if (!valid) return res.status(401).json({ message: 'Falsche E-Mail oder Passwort' }); const token = jwt.sign({ id: user._id, email: user.email }, process.env.JWT_SECRET, { expiresIn: '30d' }); res.json({ token, user: { id: user._id, email: user.email, first: user.first, last: user.last } }); } catch (err) { console.error('Login Fehler:', err); res.status(500).json({ message: 'Login fehlgeschlagen' }); } }); app.get('/api/auth/me', customerAuth, async (req, res) => { try { const user = await User.findById(req.user.id).select('-password'); if (!user) return res.status(404).json({ message: 'User nicht gefunden' }); res.json(user); } catch { res.status(500).json({ message: 'Fehler' }); } }); app.patch('/api/auth/profile', customerAuth, async (req, res) => { try { const { first, last, phone, addresses, defaultAddress } = req.body; const update = {}; if (first) update.first = first; if (last) update.last = last; if (phone !== undefined) update.phone = phone; if (addresses) update.addresses = addresses; if (defaultAddress !== undefined) update.defaultAddress = defaultAddress; const user = await User.findByIdAndUpdate(req.user.id, update, { new: true }).select('-password'); res.json(user); } catch { res.status(500).json({ message: 'Profil-Update fehlgeschlagen' }); } }); app.patch('/api/auth/password', customerAuth, async (req, res) => { try { const { currentPassword, newPassword } = req.body; if (!newPassword || newPassword.length < 6) { return res.status(400).json({ message: 'Neues Passwort mindestens 6 Zeichen' }); } const user = await User.findById(req.user.id); const valid = await bcrypt.compare(currentPassword, user.password); if (!valid) return res.status(401).json({ message: 'Aktuelles Passwort falsch' }); user.password = await bcrypt.hash(newPassword, 12); await user.save(); res.json({ message: 'Passwort geändert' }); } catch { res.status(500).json({ message: 'Fehler beim Passwort ändern' }); } }); app.get('/api/account/orders', customerAuth, async (req, res) => { try { const orders = await Order.find({ userId: req.user.id }) .sort({ createdAt: -1 }) .limit(50) .select('orderNum status payment total items createdAt mode'); res.json(orders); } catch { res.status(500).json({ message: 'Bestellhistorie konnte nicht geladen werden' }); } }); app.post('/api/account/reorder/:orderId', customerAuth, async (req, res) => { try { const original = await Order.findOne({ _id: req.params.orderId, userId: req.user.id }); if (!original) return res.status(404).json({ message: 'Bestellung nicht gefunden' }); res.json({ items: original.items, mode: original.mode, note: original.note || '' }); } catch { res.status(500).json({ message: 'Re-Order fehlgeschlagen' }); } }); // ═══════════════════════════════════════════════════════════════ // PUBLIC ROUTES // ═══════════════════════════════════════════════════════════════ app.get('/api/health', (req, res) => res.json({ status: 'ok', restaurant: 'Pizzeria Amoura', time: new Date() })); app.get('/api/config', (req, res) => res.json({ whatsapp: process.env.WHATSAPP_NUMBER || '', serviceFee: 0.99, deliveryCities: { 'Beckum': { min: 15.00, fee: 2.50 }, 'Roland': { min: 20.00, fee: 3.00 }, 'Vellern': { min: 20.00, fee: 3.00 }, } })); // ── Restaurant Status (öffentlich) ─────────────────────────────── app.get('/api/status', async (req, res) => { try { const s = await Settings.findById('restaurant'); const mode = s ? (s.mode || (s.isOpen ? 'online' : 'geschlossen')) : 'online'; res.json({ mode, isOpen: mode === 'online' }); } catch(e) { res.json({ mode: 'online', isOpen: true }); } }); // ── Restaurant Status (Admin) ───────────────────────────────────── app.patch('/api/admin/status', auth, async (req, res) => { try { const { mode, manualOverride } = req.body; const update = {}; if (mode !== undefined) update.mode = mode; if (manualOverride !== undefined) update.manualOverride = manualOverride; // Auto-Modus: sofort berechnen wenn manualOverride auf false gesetzt wird if (manualOverride === false && mode === undefined) { update.mode = calcAutoMode(); } update.isOpen = (update.mode || mode) === 'online'; const s = await Settings.findByIdAndUpdate('restaurant', update, { upsert: true, new: true }); const icons = { online:'✅ ONLINE', geschlossen:'❌ GESCHLOSSEN', neutral:'⚪ NEUTRAL' }; console.log(`🏪 Restaurant: ${icons[s.mode]} | Manuell: ${s.manualOverride}`); res.json({ mode: s.mode, manualOverride: s.manualOverride, isOpen: s.isOpen }); } catch(e) { res.status(500).json({ message: 'Fehler' }); } }); // ── Admin: aktuellen Status lesen ──────────────────────────────── app.get('/api/admin/status', auth, async (req, res) => { try { const s = await Settings.findById('restaurant'); const mode = s ? (s.mode || (s.isOpen ? 'online' : 'geschlossen')) : 'online'; res.json({ mode, manualOverride: s ? s.manualOverride : false, isOpen: mode === 'online' }); } catch(e) { res.status(500).json({ mode: 'online', manualOverride: false }); } }); app.get('/api/availability', async (req, res) => { try { const d = await Availability.find({ available: false }).select('itemName -_id'); res.json({ disabled: d.map(x => x.itemName) }); } catch(e) { res.status(500).json({ message: 'Fehler' }); } }); // ── Gutscheincode Verlosung ─────────────────────────────────────── app.post('/api/coupon-raffle', async (req, res) => { const { email, name, coupon } = req.body; if (!email || !coupon) return res.status(400).json({ error: 'Fehlende Felder' }); if ((coupon || '').toUpperCase() !== 'ROLLNCONE') return res.status(400).json({ error: 'Ungültiger Gutscheincode' }); const resend = getResend(); if (!resend) return res.json({ ok: true }); const firstName = (name || 'Kunde').split(' ')[0]; const now = new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); const customerHtml = ` <!DOCTYPE html> <html lang=\"de\"> <head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"></head> <body style=\"margin:0;padding:0;background:#fff9f5;font-family:Arial,Helvetica,sans-serif;\"> <div style=\"max-width:580px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);\"> <!-- Header: Roll N Cone --> <div style=\"background:linear-gradient(135deg,#ff6b35 0%,#ff4b8b 50%,#a855f7 100%);padding:40px 30px;text-align:center;\"> <div style=\"font-size:52px;margin-bottom:8px;\">🍦</div> <h1 style=\"color:#fff;margin:0;font-size:28px;font-weight:900;letter-spacing:-0.5px;\">Roll N Cone</h1> <p style=\"color:rgba(255,255,255,0.85);margin:6px 0 0;font-size:14px;letter-spacing:1px;text-transform:uppercase;\">× Pizzeria Amoura</p> </div> <!-- Konfetti Banner --> <div style=\"background:#fff3e0;padding:18px 30px;text-align:center;border-bottom:2px dashed #ffcc80;\"> <p style=\"margin:0;font-size:22px;font-weight:900;color:#e65100;\">🎉 Du bist dabei!</p> <p style=\"margin:4px 0 0;font-size:14px;color:#bf360c;\">Deine Teilnahme an der Verlosung wurde erfolgreich registriert.</p> </div> <!-- Body --> <div style=\"padding:30px 30px 20px;\"> <p style=\"font-size:16px;color:#333;margin:0 0 16px;\">Hallo <strong>${firstName}</strong>,</p> <p style=\"font-size:14px;color:#555;line-height:1.7;margin:0 0 20px;\"> mit dem Gutscheincode <strong style=\"color:#ff4b8b;font-size:16px;letter-spacing:2px;\">ROLLNCONE</strong> hast du erfolgreich an unserer Kooperations-Verlosung zwischen <strong>Pizzeria Amoura</strong> und <strong>Roll N Cone</strong> teilgenommen. </p> <!-- Gewinn-Box --> <div style=\"background:linear-gradient(135deg,#fff0fb,#fff8f0);border:2px solid #ffd6f0;border-radius:14px;padding:22px;text-align:center;margin-bottom:22px;\"> <p style=\"margin:0 0 8px;font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px;\">Du kannst gewinnen</p> <p style=\"margin:0;font-size:22px;font-weight:900;color:#a855f7;\">🍦 Kostenloses Roll N Cone Erlebnis</p> <p style=\"margin:8px 0 0;font-size:13px;color:#666;\">Inkl. deiner Lieblings-Kreation nach Wahl</p> </div> <div style=\"background:#f9f9f9;border-radius:10px;padding:16px 20px;margin-bottom:22px;\"> <p style=\"margin:0 0 8px;font-size:13px;font-weight:700;color:#333;\">📋 Deine Teilnahme im Überblick</p> <table style=\"width:100%;font-size:13px;color:#555;border-collapse:collapse;\"> <tr><td style=\"padding:4px 0;color:#888;\">Teilnahmedatum</td><td style=\"text-align:right;font-weight:600;\">${now}</td></tr> <tr><td style=\"padding:4px 0;color:#888;\">Code</td><td style=\"text-align:right;font-weight:600;color:#ff4b8b;\">ROLLNCONE</td></tr> <tr><td style=\"padding:4px 0;color:#888;\">E-Mail</td><td style=\"text-align:right;font-weight:600;\">${email}</td></tr> </table> </div> <p style=\"font-size:13px;color:#777;line-height:1.7;margin:0 0 20px;\"> Der Gewinner wird direkt per E-Mail benachrichtigt. Wir wünschen dir viel Glück! 🍀<br> Bis dahin – genieße deine Bestellung bei Pizzeria Amoura! 🍕 </p> </div> <!-- Roll N Cone Info --> <div style=\"background:linear-gradient(135deg,#ff6b35,#ff4b8b);padding:20px 30px;text-align:center;\"> <p style=\"color:#fff;margin:0 0 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;\">Unsere Kooperationspartner</p> <p style=\"color:rgba(255,255,255,0.9);margin:0;font-size:14px;\">🍦 Roll N Cone – Frische Eiscreme-Rollen & Waffelkegel</p> <a href=\"https://www.rollncone.de\" style=\"color:#fff;font-size:12px;opacity:0.8;text-decoration:underline;\">www.rollncone.de</a> </div> <!-- Footer --> <div style=\"background:#f7f3ee;padding:14px 30px;text-align:center;\"> <p style=\"margin:0;font-size:11px;color:#aaa;\">Pizzeria Amoura · Oststraße 48 · 59269 Beckum · Tel: 02521 / 829 06 00</p> <p style=\"margin:4px 0 0;font-size:11px;color:#ccc;\">Diese E-Mail wurde automatisch generiert.</p> </div> </div> </body> </html>`; try { await resend.emails.send({ from: process.env.EMAIL_FROM || 'bestellungen@pizzeria-amoura.de', to: email, bcc: 'rachmanfalah5@gmail.com', subject: '🎉 Deine Teilnahme an der Roll N Cone Verlosung – Pizzeria Amoura', html: customerHtml }); console.log(`🎟️ Verlosungs-Mail → ${email}`); res.json({ ok: true }); } catch(e) { console.error('Coupon-Mail Fehler:', e); res.status(500).json({ error: 'E-Mail konnte nicht gesendet werden' }); } }); // ── Neue Web-Bestellung (pending) ──────────────────────────────── app.post('/api/orders', async (req, res) => { try { // userId aus Kunden-JWT extrahieren falls vorhanden (Gastbestellung bleibt möglich) let userId = null; const authHeader = req.headers.authorization; if (authHeader && authHeader.startsWith('Bearer ')) { try { const decoded = jwt.verify(authHeader.split(' ')[1], process.env.JWT_SECRET); userId = decoded.id; } catch {} // Gastbestellung – kein Fehler } const orderNum = await getNextOrderNum(); const isPOS = req.body.source === 'pos'; const order = new Order({ ...req.body, orderNum, userId, status: isPOS ? 'confirmed' : 'pending' }); await order.save(); if (isPOS) { await sendConfirmationEmail(order, order.prepTime || 20); await sendRestaurantEmail(order); await triggerPrint(order); } await sendCouponRaffleEmail(order); res.status(201).json({ orderNum: order.orderNum, order }); } catch(e) { console.error(e); res.status(500).json({ message: 'Fehler beim Speichern' }); } }); // ── Stripe Checkout ─────────────────────────────────────────────── app.post('/api/create-stripe-checkout', async (req, res) => { try { const { items, subtotal, deliveryFee, serviceFee, total, customer, mode, note } = req.body; const orderNum = await getNextOrderNum(); const lineItems = items.filter(i => i.price > 0).map(i => ({ price_data: { currency:'eur', product_data: { name: `${i.qty}× ${i.name}${i.note?' ('+i.note+')':''}` }, unit_amount: Math.round(i.price * 100) }, quantity: i.qty, })); if (deliveryFee > 0) lineItems.push({ price_data: { currency:'eur', product_data:{ name:'Liefergebühr' }, unit_amount: Math.round(deliveryFee*100) }, quantity:1 }); if (serviceFee > 0) lineItems.push({ price_data: { currency:'eur', product_data:{ name:'Servicegebühr' }, unit_amount: Math.round(serviceFee*100) }, quantity:1 }); // Stripe Connect: Provision berechnen // serviceFee(0,99€) + 5% vom subtotal + Stripe-Transaktionsgebühr (1,5% + 0,25€) // stripeFee in appFee einrechnen → Gastro trägt Stripe-Gebühren, FlueVate behält vollen Anteil const stripeFee = Math.round((total * 0.015 + 0.25) * 100); const appFee = Math.round((serviceFee + (subtotal * 0.05)) * 100) + stripeFee; const sessionOpts = { line_items: lineItems, mode: 'payment', ...(customer.email ? { customer_email: customer.email } : {}), locale: 'de', metadata: { orderNum: String(orderNum) }, success_url: `https://pizzeria-amoura.de?order=${orderNum}&session_id={CHECKOUT_SESSION_ID}`, cancel_url: `https://pizzeria-amoura.de?payment=cancelled`, }; // Stripe Connect wenn konfiguriert if (process.env.STRIPE_CONNECT_ACCOUNT) { // Mit Connect: payment_method_types explizit (Klarna nicht mit Connect kompatibel) sessionOpts.payment_method_types = ['card']; sessionOpts.payment_intent_data = { application_fee_amount: appFee, transfer_data: { destination: process.env.STRIPE_CONNECT_ACCOUNT } }; } else { // Ohne Connect: alle im Stripe-Dashboard aktivierten Methoden erlauben // (Karte, Apple Pay, Google Pay, Klarna, etc.) sessionOpts.automatic_payment_methods = { enabled: true }; } const session = await getStripe().checkout.sessions.create(sessionOpts); const order = new Order({ items, subtotal, deliveryFee, serviceFee, total, customer, mode, note, orderNum, coupon: req.body.coupon || null, payment: 'stripe', paymentStatus: 'pending', stripeSessionId: session.id, status: 'awaiting_payment' }); await order.save(); res.json({ url: session.url, orderNum }); } catch(e) { console.error(e); res.status(500).json({ message: 'Stripe Fehler: '+e.message }); } }); // ── Stripe Webhook ──────────────────────────────────────────────── app.post('/api/stripe-webhook', async (req, res) => { let event; try { event = getStripe().webhooks.constructEvent(req.body, req.headers['stripe-signature'], process.env.STRIPE_WEBHOOK_SECRET); } catch(e) { return res.status(400).send('Webhook Error: '+e.message); } if (event.type === 'checkout.session.completed') { const s = event.data.object; const order = await Order.findOne({ stripeSessionId: s.id }); if (order) { order.paymentStatus = 'paid'; order.status = 'pending'; // wartet auf Admin-Bestätigung order.stripePaymentIntentId = s.payment_intent; await order.save(); console.log(`💳 Bezahlt: #${order.orderNum} → wartet auf Bestätigung`); await sendCouponRaffleEmail(order); } } if (event.type === 'checkout.session.expired') { await Order.findOneAndUpdate({ stripeSessionId: event.data.object.id }, { status:'cancelled' }); } res.json({ received: true }); }); // ── Zahlungsverifikation (Fallback falls Webhook fehlschlägt) ── app.post('/api/verify-payment', async (req, res) => { try { const { sessionId } = req.body; if (!sessionId) return res.status(400).json({ ok: false, message: 'sessionId fehlt' }); const session = await getStripe().checkout.sessions.retrieve(sessionId); if (session.payment_status !== 'paid') { return res.json({ ok: false, message: 'Noch nicht bezahlt' }); } const order = await Order.findOne({ stripeSessionId: sessionId }); if (!order) return res.status(404).json({ ok: false, message: 'Bestellung nicht gefunden' }); if (order.status === 'awaiting_payment') { order.paymentStatus = 'paid'; order.status = 'pending'; order.stripePaymentIntentId = session.payment_intent; await order.save(); console.log(`✅ Zahlung verifiziert (Fallback): #${order.orderNum}`); await sendCouponRaffleEmail(order); } res.json({ ok: true, orderNum: order.orderNum }); } catch(e) { console.error('verify-payment Fehler:', e.message); res.status(500).json({ ok: false, message: e.message }); } }); // ── Stripe-Bestellungen nachträglich einbuchen (Admin) ────────── app.post('/api/admin/recover-stripe-orders', auth, async (_req, res) => { try { const stuck = await Order.find({ status: 'awaiting_payment', payment: 'stripe' }); const recovered = []; for (const order of stuck) { try { const session = await getStripe().checkout.sessions.retrieve(order.stripeSessionId); if (session.payment_status === 'paid') { order.paymentStatus = 'paid'; order.status = 'pending'; order.stripePaymentIntentId = session.payment_intent; await order.save(); recovered.push(order.orderNum); console.log(`🔁 Nachträglich eingebucht: #${order.orderNum}`); } } catch(e) { console.warn(`Stripe-Abfrage für #${order.orderNum} fehlgeschlagen:`, e.message); } } res.json({ recovered, total: stuck.length }); } catch(e) { res.status(500).json({ message: e.message }); } }); // ═══════════════════════════════════════════════════════════════ // ADMIN ROUTES // ═══════════════════════════════════════════════════════════════ app.get('/api/admin/customers/:userId/orders', auth, async (req, res) => { try { const orders = await Order.find({ userId: req.params.userId }) .sort({ createdAt: -1 }) .limit(50); res.json(orders); } catch(e) { res.status(500).json({ message: 'Fehler beim Laden der Bestellungen' }); } }); app.get('/api/admin/customers', auth, async (req, res) => { try { const users = await User.find().select('-password').sort({ createdAt: -1 }); const userIds = users.map(u => u._id); const stats = await Order.aggregate([ { $match: { userId: { $in: userIds } } }, { $group: { _id: '$userId', count: { $sum: 1 }, total: { $sum: '$total' }, lastOrder: { $max: '$createdAt' } } } ]); const statsMap = {}; stats.forEach(s => { statsMap[s._id.toString()] = s; }); const result = users.map(u => ({ ...u.toObject(), orderCount: statsMap[u._id.toString()]?.count || 0, orderTotal: statsMap[u._id.toString()]?.total || 0, lastOrder: statsMap[u._id.toString()]?.lastOrder || null, })); res.json(result); } catch(e) { res.status(500).json({ message: 'Fehler beim Laden der Kunden' }); } }); app.post('/api/admin/login', (req, res) => { req.body.password === process.env.ADMIN_PASSWORD ? res.json({ token: process.env.ADMIN_TOKEN_SECRET }) : res.status(401).json({ message: 'Falsches Passwort' }); }); // ── Pending Bestellungen (für 5s Polling) ─────────────────────── app.get('/api/admin/orders/pending', auth, async (req, res) => { try { res.json({ pending: await Order.find({ status:'pending' }).sort({ createdAt:1 }) }); } catch(e) { res.status(500).json({ message:'Fehler' }); } }); // ── Alle Bestellungen ──────────────────────────────────────────── app.get('/api/admin/orders', auth, async (req, res) => { try { const dateParam = req.query.date; // z.B. \"2026-04-25\" if (dateParam) { // ── Vergangenheits-Abfrage: nur Bestellungen dieses Tages ── // Deutschland = UTC+2 (CEST) / UTC+1 (CET) // Server läuft in UTC → 2h abziehen damit der volle deutsche Tag abgedeckt ist const from = new Date(dateParam + 'T00:00:00+02:00'); const to = new Date(dateParam + 'T23:59:59+02:00'); const orders = await Order.find({ status: { $nin: ['pending', 'awaiting_payment'] }, createdAt: { $gte: from, $lte: to } }).sort({ createdAt: -1 }); const valid = orders.filter(o => o.status !== 'cancelled'); return res.json({ orders, stats: { todayCount: orders.length, todayRevenue: valid.reduce((s,o) => s+(o.total||0), 0), active: orders.filter(o=>['confirmed','preparing'].includes(o.status)).length, done: orders.filter(o=>['ready','delivered'].includes(o.status)).length, cancelled: orders.filter(o=>o.status==='cancelled').length, unpaid: orders.filter(o=>o.paymentStatus!=='paid'&&o.status!=='cancelled').length, } }); } // ── Normalfall: heutige + laufende Bestellungen ── const orders = await Order.find({ status:{ $nin:['pending'] } }).sort({ createdAt:-1 }).limit(300); const pending = await Order.find({ status:'pending' }).sort({ createdAt:1 }); const today = new Date(); today.setHours(0,0,0,0); const tod = orders.filter(o => new Date(o.createdAt) >= today && o.status !== 'awaiting_payment'); res.json({ orders, pending, stats: { todayCount: tod.length, todayRevenue: tod.filter(o=>o.status!=='cancelled').reduce((s,o)=>s+(o.total||0),0), totalRevenue: orders.reduce((s,o)=>s+(o.total||0),0), active: orders.filter(o=>['confirmed','preparing'].includes(o.status)).length, done: tod.filter(o=>['ready','delivered'].includes(o.status)).length, cancelled: tod.filter(o=>o.status==='cancelled').length, unpaid: orders.filter(o=>o.paymentStatus!=='paid'&&o.status!=='cancelled'&&o.status!=='awaiting_payment').length, } }); } catch(e) { res.status(500).json({ message:'Fehler' }); } }); // ── Bestellung BESTÄTIGEN (Annehmen + Zeit) ────────────────────── app.patch('/api/admin/orders/:id/confirm', auth, async (req, res) => { try { const { estimatedMinutes } = req.body; const order = await Order.findByIdAndUpdate(req.params.id, { status:'confirmed', prepTime: estimatedMinutes||45 }, { new:true }); if (!order) return res.status(404).json({ message:'Nicht gefunden' }); // E-Mail + Druck auslösen await sendConfirmationEmail(order, estimatedMinutes); await sendRestaurantEmail(order); await triggerPrint(order); console.log(`✅ #${order.orderNum} bestätigt – ${estimatedMinutes} Min.`); res.json(order); } catch(e) { console.error(e); res.status(500).json({ message:'Fehler' }); } }); // ── Status ändern ──────────────────────────────────────────────── app.patch('/api/admin/orders/:id/status', auth, async (req, res) => { try { const order = await Order.findByIdAndUpdate(req.params.id, { status:req.body.status }, { new:true }); if (!order) return res.status(404).json({ message:'Nicht gefunden' }); res.json(order); } catch(e) { res.status(500).json({ message:'Fehler' }); } }); // ── Bezahlstatus togglen ───────────────────────────────────────── app.patch('/api/admin/orders/:id/payment', auth, async (req, res) => { try { const order = await Order.findByIdAndUpdate(req.params.id, { paymentStatus:req.body.paymentStatus }, { new:true }); if (!order) return res.status(404).json({ message:'Nicht gefunden' }); res.json(order); } catch(e) { res.status(500).json({ message:'Fehler' }); } }); // ── STORNIEREN (mit Auto-Refund bei Stripe) ────────────────────── app.delete('/api/admin/orders/:id', auth, async (req, res) => { try { const reason = req.body?.cancelReason || ''; const order = await Order.findByIdAndUpdate(req.params.id, { status:'cancelled', cancelReason:reason }, { new:true }); if (!order) return res.status(404).json({ message:'Nicht gefunden' }); let refundStatus = null; if (order.payment === 'stripe' && order.paymentStatus === 'paid' && order.stripePaymentIntentId) { try { const refund = await getStripe().refunds.create({ payment_intent: order.stripePaymentIntentId }); refundStatus = refund.status; await Order.findByIdAndUpdate(order._id, { paymentStatus:'refunded' }); console.log(`💸 Refund #${order.orderNum}: ${refund.status}`); } catch(e) { console.error('Refund Fehler:', e.message); refundStatus='failed'; } } await sendCancellationEmail(order, reason, refundStatus); res.json({ success:true, order, refundStatus }); } catch(e) { res.status(500).json({ message:'Fehler' }); } }); // ── Bon nachdrucken ────────────────────────────────────────────── app.post('/api/admin/orders/:id/print', auth, async (req, res) => { try { const order = await Order.findById(req.params.id); if (!order) return res.status(404).json({ message:'Nicht gefunden' }); await triggerPrint(order); res.json({ success:true }); } catch(e) { res.status(500).json({ message:'Druckfehler' }); } }); // ── Verfügbarkeit (Sold-Out Toggle) ───────────────────────────── app.get('/api/admin/availability', auth, async (req, res) => { try { res.json({ items: await Availability.find() }); } catch(e) { res.status(500).json({ message:'Fehler' }); } }); app.patch('/api/admin/availability', auth, async (req, res) => { try { const { itemName, available } = req.body; if (!itemName) return res.status(400).json({ message:'itemName fehlt' }); const doc = await Availability.findOneAndUpdate( { itemName }, { available }, { upsert:true, new:true }); console.log(`${available?'✅':'❌'} \"${itemName}\" → ${available?'verfügbar':'ausverkauft'}`); res.json(doc); } catch(e) { res.status(500).json({ message:'Fehler' }); } }); // ── Finanzübersicht ────────────────────────────────────────────── app.get('/api/admin/finance', auth, async (req, res) => { try { const orders = await Order.find({ status:{ $in:['confirmed','preparing','ready','delivered'] } }); const today = new Date(); today.setHours(0,0,0,0); const wStart = new Date(); wStart.setDate(wStart.getDate() - wStart.getDay() + 1); wStart.setHours(0,0,0,0); const calc = list => { const brutto = list.reduce((s,o)=>s+(o.total||0),0); const svcFees = list.reduce((s,o)=>s+(o.serviceFee||0.99),0); const provision = (brutto - svcFees) * 0.05; return { count:list.length, brutto, svcFees, provision, auszahlung: brutto-svcFees-provision }; }; res.json({ today: calc(orders.filter(o=>new Date(o.createdAt)>=today)), week: calc(orders.filter(o=>new Date(o.createdAt)>=wStart)), }); } catch(e) { res.status(500).json({ message:'Fehler' }); } }); // ═══════════════════════════════════════════════════════════════ // E-MAIL FUNKTIONEN // ═══════════════════════════════════════════════════════════════ const cleanName = n => n.replace(/[A-Z0-9](,[A-Z0-9])+$/, '').trimEnd(); async function sendCouponRaffleEmail(order) { if (!order.coupon || order.coupon.toUpperCase() !== 'ROLLNCONE') return; const now = new Date(); const start = new Date('2026-05-19T00:00:00+02:00'); const end = new Date('2026-06-02T23:59:59+02:00'); if (now < start || now > end) return; if (!order.customer?.email) return; const resend = getResend(); if (!resend) return; const firstName = (order.customer.first || 'Kunde'); const email = order.customer.email; const now = new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); const html = `<!DOCTYPE html> <html lang=\"de\"> <head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"></head> <body style=\"margin:0;padding:0;background:#fff9f5;font-family:Arial,Helvetica,sans-serif;\"> <div style=\"max-width:580px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);\"> <div style=\"background:linear-gradient(135deg,#ff6b35 0%,#ff4b8b 50%,#a855f7 100%);padding:40px 30px;text-align:center;\"> <div style=\"font-size:52px;margin-bottom:8px;\">🍦</div> <h1 style=\"color:#fff;margin:0;font-size:28px;font-weight:900;letter-spacing:-0.5px;\">Roll N Cone</h1> <p style=\"color:rgba(255,255,255,0.85);margin:6px 0 0;font-size:14px;letter-spacing:1px;text-transform:uppercase;\">× Pizzeria Amoura</p> </div> <div style=\"background:#fff3e0;padding:18px 30px;text-align:center;border-bottom:2px dashed #ffcc80;\"> <p style=\"margin:0;fo