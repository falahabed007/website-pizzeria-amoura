ht ${monat} + Rechnung ${rechnungNr} versendet`); } catch(e) { console.error('Monatsbericht Fehler:', e); } }); // ── Monatsbericht manuell triggern ─────────────────────────────── // POST /api/admin/send-monthly?month=2026-05 (oder leer = aktueller Monat) app.post('/api/admin/send-monthly', auth, async (req, res) => { try { const monthParam = req.query.month; // z.B. \"2026-05\" let refDate; if (monthParam) { const [y, m] = monthParam.split('-').map(Number); refDate = new Date(y, m - 1, 28, 22, 0, 0); // letzter Tag des Monats } else { refDate = new Date(); } const now = refDate; const mStart = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0); const mEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999); const monat = now.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' }); const datum = mEnd.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit', year:'numeric' }); const vonBis = `${mStart.toLocaleDateString('de-DE')} – ${datum}`; const rechnungNr = await getNextRechnungNum(); const orders = await Order.find({ status: { $in: ['confirmed','preparing','ready','delivered'] }, createdAt: { $gte: mStart, $lte: mEnd } }); const brutto = orders.reduce((s,o) => s+(o.total||0), 0); const svcFees = orders.reduce((s,o) => s+(o.serviceFee||PDF_SV), 0); const nettoBase = brutto - svcFees; const provision = nettoBase * PDF_PR; const meinBetrag = svcFees + provision; const auszahlung = brutto - meinBetrag; const barOrdersM = orders.filter(o => o.payment === 'bar'); const barSvcM = barOrdersM.reduce((s,o) => s+(o.serviceFee||PDF_SV), 0); const barNettoM = barOrdersM.reduce((s,o) => s+(o.total||0), 0) - barSvcM; const barProvM = barNettoM * PDF_PR; const barBetragM = barSvcM + barProvM; const weeksMap = {}; orders.forEach(o => { const kw2=getWeekNum(new Date(o.createdAt)); if(!weeksMap[kw2])weeksMap[kw2]={n:0,brutto:0}; weeksMap[kw2].n++; weeksMap[kw2].brutto+=o.total||0; }); const weekRows = Object.entries(weeksMap).sort((a,b)=>+a[0